aid: surtr-defense-systems
name: Surtr Defense Systems
description: >-
  Surtr Defense Systems is a Y Combinator-backed defense technology company building ParallaxOS,
  an open operating system for counter-UAS (counter-drone) command-and-control. Surtr positions
  itself outside the incumbent C2 tension by not competing with hardware partners on contracts and
  not monetizing partner data: hardware partners decide what data the platform sees, customers decide
  what data is kept, and every byte is visible to partners and customers in real time. ParallaxOS
  ingests any sensor (radar, RF, EO/IR, acoustic) over open defense-interoperability standards such
  as NATO SAPIENT, Link 16, Cursor on Target, and ATAK; tasks any compatible kinetic, EW, or
  directed-energy effector with human-in-the-loop authorization on every engagement; and performs
  multi-sensor fusion, autonomous track correlation, and AI threat classification at millisecond
  latency on the tactical edge. Customer data, integration code, and decisions remain the customer's,
  deployed on-prem or in GovCloud. Founded by Anshul Ahluwalia (CEO, ex-Shield AI) and Cameron Fiore
  (CTO, ex-Anduril, ex-Shield AI). Added to the API Evangelist network as a portfolio lead; no public
  developer API surface is published as of this enrichment pass.
